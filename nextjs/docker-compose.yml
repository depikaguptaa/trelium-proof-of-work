services:
  db:
    image: postgres:16
    container_name: trelium-pow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trelium
      POSTGRES_PASSWORD: trelium
      POSTGRES_DB: trelium
    ports:
      - "5432:5432"
    volumes:
      - trelium-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trelium -d trelium"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trelium-pgdata:
